name: gui_app

channels:
    - pytorch
    - nvidia
    - conda-forge
    - defaults

dependencies:
    - python=3.10
    - pip
    - numpy
    - pandas
    - scipy
    - scikit-learn
    - matplotlib
    - seaborn
    - tqdm
    - pyyaml
    - joblib
    - pyside6
    - rdkit
    - biopython
    - pytorch=2.3.1
    - torchvision=0.18.1
    - torchaudio=2.3.1
    - pytorch-cuda=11.8
    - ipython
    - ipykernel
    - jupyterlab
    - lifelines
    - pip:
          - deepsmiles
          - torch-geometric==2.7.0
