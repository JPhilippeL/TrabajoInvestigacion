schema_version: 1

dataset:
  name: MPro-URV
  variant_id: urv_full_pqr
  description: >
    Final DCML full dataset for MPro-URV using both distance descriptors and
    real charge descriptors generated from protein PQR files and charged ligand
    MOL2 files.
  recommended_for_final_report: true
  purpose: final_scientific_dataset_with_real_charges

source:
  staging_root: data_urv
  raw_structures_root: data_urv/pdbbind_like/URV/refined
  pqr_root: data_urv/pdbbind_like/URV/pqr
  source_sample_ids_csv: data_urv/dcml_input/MProURV_all_sample_ids.csv
  source_label_npy: data_urv/dcml_input/MProURV_all_label.npy

charge_preparation:
  script: prepare_urv_real_charges.py
  requires:
    - obabel
    - pdb2pqr_or_pdb2pqr30
  force_field: AMBER
  ph: 7.0
  ligand_charge_method: gasteiger
  protein_fallback: auto
  protein_charge_method: gasteiger
  known_repair_ids:
    - 8ACL
    - 8Q71
  expected_command: >
    python prepare_urv_real_charges.py
    --work-root data_urv
    --pqr-root data_urv/pdbbind_like/URV/pqr
    --ff AMBER
    --ph 7.0
    --ligand-charge-method gasteiger
    --protein-fallback auto
    --protein-charge-method gasteiger
    --workers 2

generation:
  feature_mode: full
  charge_mode: pqr
  output_mode_argument: full
  charge_mode_argument: pqr
  generator_script: generate_urv_dcml_features.py
  expected_command: >
    python generate_urv_dcml_features.py
    --work-root data_urv
    --out-npy data_urv/dcml_input/MProURV_all_feature_real_charge.npy
    --out-zip data_urv/dcml_input/MProURV_all_feature_real_charge.zip
    --write-zip
    --output-mode full
    --charge-mode pqr
    --pqr-root data_urv/pdbbind_like/URV/pqr
    --dtype float32
    --workers 2
    --force

features:
  n_samples: 378
  n_features: 118360
  distance_features: 63360
  charge_features: 55000
  dtype: float32
  format: zip_with_single_npy
  expected_shape: [378, 118360]
  expected_charge_block:
    mode: pqr
    should_have_nonzero_values: true
    validation_conditions:
      finite: true
      zero_rows: 0
      charge_nonzero_greater_than: 0
      charge_sum_abs_greater_than: 0.0

labels:
  n_samples: 378
  target: pIC50
  format: npy_1d
  expected_shape: [378]

dataset_root: DCML/datasets/urv_full_pqr

files:
  all:
    feature_zip: all_feature.zip
    label_npy: all_label.npy
    sample_ids_csv: sample_ids.csv

  splits:
    split_indices_json: split_indices.json

    train_feature_zip: train_feature.zip
    train_label_npy: train_label.npy

    validation_feature_zip: validation_feature.zip
    validation_label_npy: validation_label.npy

    test_feature_zip: test_feature.zip
    test_label_npy: test_label.npy

    trainval_feature_zip: trainval_feature.zip
    trainval_label_npy: trainval_label.npy

  reports:
    feature_generation_report_json: feature_generation_report.json
    real_charge_feature_validation_json: real_charge_feature_validation.json
    real_charge_preparation_report_csv: real_charge_preparation_report.csv
    real_charge_preparation_report_json: real_charge_preparation_report.json

required_files_for_hpo:
  - train_feature.zip
  - train_label.npy
  - validation_feature.zip
  - validation_label.npy

required_files_for_final_training:
  - trainval_feature.zip
  - trainval_label.npy

required_files_for_final_evaluation:
  - test_feature.zip
  - test_label.npy

split:
  method: random_holdout
  seed: 42
  n_samples: 378
  train_count: 264
  validation_count: 57
  test_count: 57
  train_ratio_effective: 0.6984
  validation_ratio_effective: 0.1508
  test_ratio_effective: 0.1508
  split_indices_file: split_indices.json

protocol:
  hyperparameter_search:
    train_features: train_feature.zip
    train_labels: train_label.npy
    validation_features: validation_feature.zip
    validation_labels: validation_label.npy
    primary_metric: RMSE
    primary_goal: min
    secondary_metric: Pearson
    secondary_goal: max

  final_training:
    train_features: trainval_feature.zip
    train_labels: trainval_label.npy

  final_evaluation:
    test_features: test_feature.zip
    test_labels: test_label.npy

status:
  binary_artifacts_generated: false
  charges_prepared: false
  charge_block_validated: false
  splits_generated: false
  ready_for_hpo: false
  ready_for_final_training: false
  ready_for_final_evaluation: false

notes:
  - This is the main dataset variant to use for the serious final DCML experiment.
  - The charge block must not be zero.
  - The model trained on this dataset is incompatible with distance-only features because the number of columns differs.
